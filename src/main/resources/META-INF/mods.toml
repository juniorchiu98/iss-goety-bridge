modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 必要依賴:兩個被整合的 mod
[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
mandatory = true
versionRange = "[1.20.1-3.16.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = true
versionRange = "[5.14.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "goety"
mandatory = true
# Goety 的版本字串格式未確認,先放寬;之後再收緊
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "issgoety.mixins.json"
